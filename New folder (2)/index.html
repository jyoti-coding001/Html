<html>
<head><title>Employee Web</title></head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css"/>
<body>
    <header>
        <div class="logo-style"><img src="images/logo.png" /></div>
        <div class="header-center" id="mainmenu">
            <ul>
                <li>Home</li>
                <li>About us <i class="fa-solid fa-angle-down"></i></li>
                <li>Services <i class="fa-solid fa-angle-down"></i></li>
                <li>Contact us</li>
            </ul>
        </div>
        <div class="header-action">
            <div class="button-element"><img src="images/button.png" /></div>
            <div id="menubar">
                <button type="button" onclick="buttonstyle()" class="button-element button-hide"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <script src="js/style.js"></script>
</body>
</html>
