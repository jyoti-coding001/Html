<html>
<head>
	<title>Login Page</title>
	<link rel="stylesheet" href="css/style.css" />
</head>
<body>
	<div class="box" id="Signform">
		<div class="form-heading">
			<div><p class="title">Sign up</p></div>
		</div>
	</br>
		<form>
			<label>First Name:</label>
			<input type="text" placeholder="Your name"></br>
			<label>Last Name:</label>
			<input type="text" placeholder="last name"></br>
			<label>Email:</label>
			<input type="Email" placeholder="@gmail.com" required id="useremail"></br>
			<label>Password</label>
			<input type="password" placeholder="Enter your Password" maxlength="8" required id="userpassw"></br>
			<button type="button" onclick="signup()">Sign up</button>	
		</form>
	</div>
	<div class="box2" id="loginfrom">	
		<div class="form-heading">
			<p class="title">Login</p>
		</div>
	</br>
		<form>
			<label>Email:</label>
			<input type="Email" placeholder="@gmail.com" required ></br>
			<label>Password</label>
			<input type="password" placeholder="Enter your Password" maxlength="8" required ></br>
			<button type="submit">Login</button>

		</form>

	</div>
	<script src="js/script.js"></script>
</body>
</html>
