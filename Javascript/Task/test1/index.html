<html>
<head>
    <title>TEST-1</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/test.css" />
</head>
<body>
    <div align="center" class="container">
            <h2>Type of Color</h2>
            <div class="box" id="boxcolor">
				<p id="colorname">Black</p>
			</div> 
				<div>
					<div class="button-box width" style="background:#FE81D4;" onclick="addcolor('pink','Pink')" >
						<P>Pink</p>
						<P>#FE81D4</p>
					</div>
					<div class="button-box width" style="background:#FFDE42;" onclick="addcolor('yellow', 'Yellow')" >
						<P>Yellow</p>
						<P>#FFDE42</p>
					</div>
					<div class="button-box width" style="background:#2F6B3F;" onclick="addcolor('Green','Green')" >
						<P>Green</p>
						<P>#2F6B3F</p>
					</div>
					<div class="button-box width" style="background:#DB1A1A;" onclick="addcolor('Red','Red')" >
						<P>Red</p>
						<P>#DB1A1A</p>
					</div>
					<div class="button-box width" style="background:#9a47c1;" onclick="addcolor('Purple','Purple')" >
						<P>Purple</p>
						<P>#E9d2F4</p>
					</div>
					<div class="button-box width" style="background:#4c3005;" onclick="addcolor('Brown','Brown')" >
						<P>Brown</p>
						<P>#4C3005</p>
					</div>
					<div class="button-box width" style="background:#9b9b93;" onclick="addcolor('grey','Grey')" >
						<P>Grey</p>
						<P>#9B9B93</p>
					</div>
					<div class="button-box width" style="background:#FAACBF;" onclick="addcolor('light-pink','Light-Pink')" >
						<P>Light Pink</p>
						<P>#FAACBF</p>
					</div>
					<div class="button-box width" style="background:#FF6700;" onclick="addcolor('Pumpkin','Pumpkin-Spice')" >
						<P>Pumpkin spice</p>
						<P>#FF6700</p>
					</div>
					<div class="button-box width" style="background:#3A6EA5;" onclick="addcolor('Cornflower','Cornflower-Ocean')" >
						<P>Cornflower Ocean</p>
						<P>#3A6EA5</p>
					</div>
					<div class="button-box width" style="background:#6367FF;" onclick="addcolor('Blue','Blue')" >
						<P>Blue</p>
						<P>#6367FF</p>
					</div>
					<div class="button-box width" style="background:#C1121F;" onclick="addcolor('flag-red','Flag-red')" >
						<P>Flag Red</p>
						<P>#C1121F</p>
					</div>
					
				</div>    
    </div>
	<script src="js/style.js"></script>

</body>
</html>
